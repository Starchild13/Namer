  name: create_name
  description: "A responsive Flutter application that generates creative, unique-sounding names by combining random words. Users can generate new name suggestions, save their favourite combinations, and view their saved names on a dedicated favourites page."
  publish_to: 'none'

  version: 1.0.0+1

  environment:
    sdk: ^3.7.2

  dependencies:
    flutter:
      sdk: flutter

    cupertino_icons: ^2.0.0
    english_words: ^4.0.0
    provider: ^6.1.5
    google_fonts: ^6.3.2

  dev_dependencies:
    flutter_test:
      sdk: flutter

    flutter_lints: ^6.0.0

  flutter:
    uses-material-design: true

